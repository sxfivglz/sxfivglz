name: Generate contribution visuals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "scripts/generate_combined_contributions.py"
      - "tests/test_generate_combined_contributions.py"

concurrency:
  group: contribution-visuals
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the combined contribution generator
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate the combined contribution calendar
        run: >-
          python scripts/generate_combined_contributions.py
          --users sxfivglz SofiaNeurya
          --output dist/combined-contributions.svg

      - name: Generate the personal contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sxfivglz
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish contribution visuals
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
