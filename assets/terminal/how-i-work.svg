 attributeName="opacity" values="0;0" dur="0.40s"/><text x="24" y="72.0"><tspan fill="#8ae234" font-weight="bold">sofia@sxfivglz</tspan><tspan fill="#d0cfcc">:</tspan><tspan fill="#729fcf" font-weight="bold">~</tspan><tspan fill="#d0cfcc">$ </tspan></text><text x="175.7" y="72.0" clip-path="url(#how-i-work-type-0)"><tspan fill="#d0cfcc">cat how-i-work.txt</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.46s"/><text x="24" y="93.0"><tspan fill="#8ae234" font-weight="bold">Teamwork              </tspan><tspan fill="#d0cfcc">I&#x27;ve worked in development teams since my internship, and today I partner</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.51s"/><text x="24" y="114.0"><tspan fill="#8ae234" font-weight="bold">                      </tspan><tspan fill="#d0cfcc">with a consulting team to deliver complete products</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.56s"/><text x="24" y="135.0"><tspan fill="#8ae234" font-weight="bold">Clear communication   </tspan><tspan fill="#d0cfcc">I explain the why behind each change and document what I build so others</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.61s"/><text x="24" y="156.0"><tspan fill="#8ae234" font-weight="bold">                      </tspan><tspan fill="#d0cfcc">can operate it</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.66s"/><text x="24" y="177.0"><tspan fill="#8ae234" font-weight="bold">Problem solving       </tspan><tspan fill="#d0cfcc">I trace production issues end to end, even when the cause is outside our</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.71s"/><text x="24" y="198.0"><tspan fill="#8ae234" font-weight="bold">                      </tspan><tspan fill="#d0cfcc">own system</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.76s"/><text x="24" y="219.0"><tspan fill="#8ae234" font-weight="bold">Ownership             </tspan><tspan fill="#d0cfcc">I stay with what I build after launch and keep supporting it in production</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.81s"/><text x="24" y="240.0"><tspan fill="#8ae234" font-weight="bold">Judgment              </tspan><tspan fill="#d0cfcc">I flag technical, policy and legal risks before building, not after</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.86s"/><text x="24" y="261.0"><tspan fill="#8ae234" font-weight="bold">Continuous learning   </tspan><tspan fill="#d0cfcc">I moved from web and mobile development to AI and agentic systems, and</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="1.91s"/><text x="24" y="282.0"><tspan fill="#8ae234" font-weight="bold">                      </tspan><tspan fill="#d0cfcc">keep learning as the field evolves</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.11s"/><text x="24" y="303.0"><tspan fill="#8ae234" font-weight="bold">sofia@sxfivglz</tspan><tspan fill="#d0cfcc">:</tspan><tspan fill="#729fcf" font-weight="bold">~</tspan><tspan fill="#d0cfcc">$ </tspan></text><text x="175.7" y="303.0" clip-path="url(#how-i-work-type-1)"><tspan fill="#d0cfcc">ls ~/exploring</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.99s"/><text x="24" y="324.0"><tspan fill="#729fcf" font-weight="bold">llm-evals  agent-reliability  mcp  cloud-infrastructure  observability</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.19s"/><text x="24" y="345.0"><tspan fill="#8ae234" font-weight="bold">sofia@sxfivglz</tspan><tspan fill="#d0cfcc">:</tspan><tspan fill="#729fcf" font-weight="bold">~</tspan><tspan fill="#d0cfcc">$ </tspan></text><rect x="175.7" y="333.0" width="8.4" height="16" 