="24" y="261.0"><tspan fill="#d0cfcc">assistants, and automations that remove manual work, connected to the systems each company</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.20s"/><text x="24" y="282.0"><tspan fill="#d0cfcc">already uses. I mainly work with Python / FastAPI and TypeScript / Next.js, and I stay involved</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.25s"/><text x="24" y="303.0"><tspan fill="#d0cfcc">from technical design until the solution runs in production.</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.30s"/><text x="24" y="345.0"><tspan fill="#8f8f96">Location: </tspan><tspan fill="#d0cfcc">Torreón, Coahuila, Mexico</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.50s"/><text x="24" y="366.0"><tspan fill="#8ae234" font-weight="bold">sofia@sxfivglz</tspan><tspan fill="#d0cfcc">:</tspan><tspan fill="#729fcf" font-weight="bold">~</tspan><tspan fill="#d0cfcc">$ </tspan></text><text x="175.7" y="366.0" clip-path="url(#about-type-2)"><tspan fill="#d0cfcc">echo $FOCUS</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.25s"/><text x="24" y="387.0"><tspan fill="#ad7fa8">Agentic Development · LLM Integrations · MCP Servers · WhatsApp Automation · APIs &amp; Integrations</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.30s"/><text x="24" y="408.0"><tspan fill="#ad7fa8">· Full Stack Development · Production Support</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.35s"/><text x="24" y="429.0"><tspan fill="#8f8f96">I enjoy turning manual, repetitive processes into reliable tools that people use every day.</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.55s"/><text x="24" y="450.0"><tspan fill="#8ae234" font-weight="bold">sofia@sxfivglz</tspan><tspan fill="#d0cfcc">:</tspan><tspan fill="#729fcf" font-weight="bold">~</tspan><tspan fill="#d0cfcc">$ </tspan></text><rect x="175.7" y="438.0" width="8.4" height="16" fill="#d0cfcc"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></g></svg>
