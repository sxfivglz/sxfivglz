<text x="24" y="576.0"><tspan fill="#d0cfcc">  Database architecture, backend and APIs for tournament, player profile and ranking management.</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.77s"/><text x="24" y="618.0"><tspan fill="#fce94f" font-weight="bold">» Field Crew Tracking (team project)</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.82s"/><text x="24" y="639.0"><tspan fill="#34e2e2">  Laravel</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.87s"/><text x="24" y="660.0"><tspan fill="#d0cfcc">  Crew tracking and geolocation for fiber optic and utility pole installation, generating the</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.92s"/><text x="24" y="681.0"><tspan fill="#d0cfcc">  standardized reports required by internet providers.</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="2.97s"/><text x="24" y="723.0"><tspan fill="#8f8f96"># Most of my work lives in private client repositories under NDA, so projects are described</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.02s"/><text x="24" y="744.0"><tspan fill="#8f8f96">without client names. I&#x27;m happy to walk through the architecture and decisions in an interview.</tspan></text></g><g class="reveal"><animate attributeName="opacity" values="0;0" dur="3.22s"/><text x="24" y="765.0"><tspan fill="#8ae234" font-weight="bold">sofia@sxfivglz</tspan><tspan fill="#d0cfcc">:</tspan><tspan fill="#729fcf" font-weight="bold">~</tspan><tspan fill="#d0cfcc">$ </tspan></text><rect x="175.7" y="753.0" width="8.4" height="16" fill="#d0cfcc"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></g></svg>
